{{- if .Values.isLbEnabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "{{ .Values.app.name }}-{{ .Release.Name }}-{{ .Release.Namespace }}"
  namespace: "{{ .Values.namespace }}"
spec:
  parentRefs: 
    - name: "{{ .Values.gateway }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: "{{ .Values.app.name }}" 
          port: {{ .Values.appServicePort }}
{{- end}} 
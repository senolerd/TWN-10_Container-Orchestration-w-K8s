{{- if and .Values.isLbEnabled .Values.gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: "{{ .Values.frontend.name }}-{{ .Release.Name }}-{{ .Release.Namespace }}"
    namespace: "{{ .Values.namespace }}"
spec:
  parentRefs: 
    - name: "{{ .Values.gateway }}"

  {{- if not .Values.hostname}} # dedicated LB
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: "{{ .Values.frontend.name }}" 
          port: {{ .Values.frontend.port }}
  {{- end}}

  {{- if .Values.hostname}} # shared LB
  hostnames:
    - {{ .Values.hostname }} 
  rules:
    - backendRefs:
      - name: {{ .Values.frontend.name }}
        port: {{ .Values.frontend.port }}
  {{- end}}

{{- end}} 
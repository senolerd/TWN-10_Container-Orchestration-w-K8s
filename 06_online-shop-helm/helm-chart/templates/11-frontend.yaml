apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  labels:
    app: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.name }}
    spec:
      containers:
      - name: app
        image: "{{ .Values.imageRegistry }}/{{ .Values.frontend.name }}:{{ .Chart.AppVersion }}"
        ports:
        - containerPort: {{.Values.frontend.port}}
        env:
        - name: PORT
          value: {{ .Values.frontend.port | quote }}
        {{- range $key, $value := .Values.frontend.envVar }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}
spec:
  {{- if .Values.nodePort }}
  type: NodePort           
  {{- end}}
  selector:
    app: {{ .Values.frontend.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      {{- if .Values.nodePort }}
      nodePort: {{ .Values.nodePort }}
      {{- end}}
